<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="/static/css/main.css">
        <script src="/socket.io/socket.io.js"></script>
        <script src="/static/scripts/chat_test.js"></script>
    </head>
    <body>
        <div id="maincontainer">
            <div id="side-bar">
                <img src="/static/svg/pager_logo.svg" alt="pager logo" id="logo-side">
                <h2 id="greeting"></h2>
                <div id="room-list"></div>
                <div id="floating-button-row" >
                    <div id="floating-button-subrow">
                        <button class="floating-button floating-button-small" onclick="logout()">L</button>
                        <button class="floating-button floating-button-small">C</button>
                    </div>
                    <button class="floating-button">+</button>
                </div>
            </div>
            <div id="chat-container">
                <div id="chatbox"></div>
                <div id="input-box">
                    <input type="text" id="chatinput" placeholder="Type a message...">
                    <button id="send-button" onclick="sendMsg()">></button>
                </div>
            </div>
        </div>
    </body>
</html>
