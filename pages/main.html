<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pager</title>
        <link rel="shortcut icon" href="/static/svg/favicon.svg" type="image/x-icon">
        <link rel="stylesheet" href="/static/css/main.css">
        <script src="/socket.io/socket.io.js"></script>
        <script src="/static/scripts/chat.js"></script>
    </head>
    <body>
        <dialog id="new-chat-dialog">
            <h2 id="new-chat-text" class="dialog-text">Create a New Chat</h2>
            <div id="dm-chat-button-row">
                <div id="dm-chat-button-outskirt">
                    <button id="dm-button" class="dm-chat-button dm-chat-button-selected" onclick="newChatSwitchDm()">Direct Message</button>
                    <button id="chat-button" class="dm-chat-button" onclick="newChatSwitchChat()">Group Chat</button>
                </div>
            </div>
            <h4 id="chat-name-text" hidden>Chat Name</h4>
            <div id="chat-name-input-box" class="full-hidden">
                <input type="text" id="chat-name-input" placeholder="Enter the chat name..." maxlength="50">
            </div>
            <h4 id="new-chat-users-text">Users</h4>
            <div id="users-box"></div>
            <span id="user-warning-text" hidden></span>
            <div id="user-input-box">
                <input type="text" id="user-input" placeholder="Add a user...">
                <button id="add-user-button" onclick="newChatAddUser()">Add User</button>
            </div>
            <div id="button-row">
                <button class="button button-invert" onclick="closeNewChatDialog()">Cancel</button>
                <button class="button" onclick="createNewChat()">Create Chat</button>
            </div>
        </dialog>
        <div id="maincontainer">
            <div id="side-bar" class="show-side-bar">
                <div id="menu-button" onclick="menuButton()"></div>
                <img src="/static/svg/pager_logo.svg" alt="pager logo" id="logo-side" onclick="home()">
                <h2 id="greeting"></h2>
                <div id="global-chat" class="room" onclick="switchChat(this.id)">
                    <div class="room-name">Global Chat</div>
                </div><hr>
                <h3 id="your-chats">Your Chats</h3>
                <div id="room-list"></div>
                <div id="floating-button-row" >
                    <div id="floating-button-subrow">
                        <button id="logout-button" class="floating-button floating-button-small" onclick="logout()"></button>
                        <button id="dark-mode-button" class="floating-button floating-button-small" onclick="darkModeToggle()"></button>
                    </div>
                    <button id="chat-add-button" class="floating-button" onclick="openNewChatDialog()"></button>
                </div>
            </div>
            <div id="welcome">
                <h1>Welcome to Pager</h1>
                <p>Open or create a chat to start talking to people</p>
            </div>
            <div id="chat-container" class="full-hidden">
                <div id="chatbox"></div>
                <div id="input-box">
                    <input type="text" id="chatinput" placeholder="Type a message...">
                    <button id="send-button" onclick="sendMsg()"></button>
                </div>
            </div>
        </div>
    </body>
</html>
