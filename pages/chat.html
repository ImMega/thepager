<!DOCTYPE html>
<html>
    <head>
        <title>Pager - Chat</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../static/css/chat.css">
        <script src="/socket.io/socket.io.js"></script>
        <script src="../static/scripts/chat.js"></script>
    </head>
    <body>
        <div id="maincontainer">
            <img src="/static/svg/pager_logo.svg" alt="pager logo" width="20%" style="margin: 0 0 -30px 30px; align-self: baseline;">
            <p style="margin: -30px 0 10px 0; font-size: 10pt;">v0.0.1 Exclusive MARIN pre-alpha test</p>
            <h1 id="greeting"></h1>
            <div id="chat">
                <div id="chatbox">
                </div>
                <div id="inputbox">
                    <input id="chatinput" type="text" placeholder="Type a message...">
                    <button id="sendbutton" onclick="sendMsg()">></button>
                </div>
            </div>
            <button onclick="logout()">Logout</button>
        </div>
    </body>
</html>
